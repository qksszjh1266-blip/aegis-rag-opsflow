[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aegis-rag-opsflow"
version = "0.1.0"
description = "企业多租户混合检索与确定性履约工单平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncmy>=0.2.9,<1",
    "alembic>=1.14,<2",
    "cryptography>=43",
    "redis>=5.0,<8",
    "qdrant-client>=1.12,<2",
    "structlog>=24.4",
    "prometheus-client>=0.21,<1",
    "httpx>=0.27,<1",
    "mcp>=1.30,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
    "fakeredis[lua]>=2.26,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: 需要启动真实 MySQL、Redis、Qdrant 的集成测试"]

[tool.coverage.run]
source = ["aegis"]
branch = true
